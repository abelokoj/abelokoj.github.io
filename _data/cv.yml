    Projects: # populated from your blog posts -- trim/expand/add links as you prefer
      - name: Sherman-Morrison-Accelerated ODE Solvers for Sustainable Aviation Modeling
        summary: "Applied the Sherman-Morrison formula to avoid re-factorizing a system matrix at every implicit-Euler time step in a rank-one, time-varying ODE system motivated by aircraft fuel-burn dynamics."
        highlights:
          - "Reduced per-step cost from O(n^3) to O(n^2)"
          - "Validated against a naive refactor-every-step baseline"
        start_date: 2026
        end_date: 2026

      - name: Stiff ODE Solvers and Stability Analysis
        summary: "Analyzed why explicit Runge-Kutta methods fail on stiff systems (Van der Pol oscillator) and benchmarked explicit vs. implicit (Radau) solver cost across a range of stiffness parameters."
        highlights:
          - "Derived absolute-stability regions for forward/backward Euler from the Dahlquist test equation"
        start_date: 2026
        end_date: 2026

      - name: Uncertainty Quantification via Polynomial Chaos Expansion
        summary: "Built a Legendre polynomial-chaos surrogate model and compared its spectral convergence against standard Monte Carlo sampling."
        highlights:
          - "Matched machine-precision accuracy in ~15-20 evaluations vs. tens of thousands for Monte Carlo"
        start_date: 2026
        end_date: 2026

      - name: "Physics-Informed Neural Networks vs. Classical Solvers"
        summary: "A quantitative, from-scratch comparison of a PINN against a classical adaptive ODE solver on a problem with a known closed-form solution."
        highlights:
          - "Benchmarked accuracy and wall-clock cost against ground truth, not just against each other"
        start_date: 2026
        end_date: 2026

      - name: HPC Domain Decomposition for Wave Propagation
        summary: "Implemented 1D domain decomposition with halo exchange for a 2D wave equation and verified bit-for-bit equivalence with a monolithic solve."
        highlights:
          - "Analyzed scaling behavior via Amdahl's Law and a weak-scaling communication-overhead model"
        start_date: 2026
        end_date: 2026

